# Issue #148 local synthetic acceptance only. No existing DB, Secret or volume.
name: future-roi-148-takeover
services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: futureroi_issue148
      POSTGRES_USER: issue148_synthetic
      POSTGRES_PASSWORD: issue148-synthetic-only
    ports: ['127.0.0.1:15488:5432']
    tmpfs: ['/var/lib/postgresql:size=256m']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U issue148_synthetic -d futureroi_issue148']
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    image: future-roi-148-takeover:local
    build: ../../../..
    init: true
    command: ['node', 'apps/api/dist/container-start.js']
    environment:
      DATABASE_URL: postgres://issue148_synthetic@db:5432/futureroi_issue148
      PGPASSWORD: issue148-synthetic-only
      BETTER_AUTH_SECRET: issue148-synthetic-only-test-secret-000000000000
      BETTER_AUTH_URL: http://127.0.0.1:8097
      BETTER_AUTH_ALLOW_HTTP: '1'
      AUTH_SIGN_UP_MAX: '100'
      AUTH_SIGN_IN_MAX: '100'
    ports: ['127.0.0.1:8097:8080']
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 15s
