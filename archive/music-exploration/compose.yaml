name: jogi-hack-local

services:
  web:
    build: .
    command: npm run dev:web
    environment:
      JOGI_WEB_HOST: 0.0.0.0
      JOGI_API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  api:
    build: .
    command: npm run dev:api
    environment:
      JOGI_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: jogi
      POSTGRES_USER: jogi
      POSTGRES_PASSWORD: ${JOGI_LOCAL_DB_PASSWORD:?Set JOGI_LOCAL_DB_PASSWORD in the current shell}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jogi -d jogi"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
