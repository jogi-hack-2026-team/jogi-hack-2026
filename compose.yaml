name: jogi-hack-local

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: jogi
      POSTGRES_USER: jogi
      POSTGRES_PASSWORD: ${JOGI_LOCAL_DB_PASSWORD:?Set JOGI_LOCAL_DB_PASSWORD in the current shell}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jogi -d jogi"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
