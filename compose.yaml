# ローカル開発用。既定ではPostgreSQLだけを起動し、WebとAPIはhostのNodeで動かす。
# `docker compose --profile app up` で単一コンテナ（Dockerfile）も起動して配信を確認できる。
name: future-roi-local

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: futureroi
      POSTGRES_USER: futureroi
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in the current shell or .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U futureroi -d futureroi"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://futureroi:${LOCAL_DB_PASSWORD}@db:5432/futureroi
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
